<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Lojinha Meu Look IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .image-inputs {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .image-input {
            flex: 1;
            min-width: 200px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-edit {
            background: #f39c12;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
        }

        .produtos-list {
            margin-top: 30px;
        }

        .produto-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }

        .produto-item.active {
            border-left-color: #2ecc71;
            background: #e8f8f5;
        }

        .produto-info h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .produto-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .produto-actions {
            display: flex;
            gap: 10px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .badge-success {
            background: #2ecc71;
            color: white;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ Gerenciar Lojinha</h1>
            <p class="subtitle">Adicione e gerencie produtos em destaque no app</p>
        </div>

        <div id="alert" class="hidden"></div>

        <div class="card">
            <h2 style="color: #667eea; margin-bottom: 20px;">
                <span id="form-title">Adicionar Novo Produto</span>
            </h2>

            <form id="produtoForm">
                <input type="hidden" id="produtoId">

                <div class="form-group">
                    <label for="title">Título do Produto *</label>
                    <input type="text" id="title" required placeholder="Ex: Conjunto Fitness Premium">
                </div>

                <div class="form-group">
                    <label for="description">Descrição *</label>
                    <textarea id="description" required placeholder="Descreva o produto..."></textarea>
                </div>

                <div class="form-group">
                    <label>Imagens (URLs) - Adicione 3 imagens *</label>
                    <div class="image-inputs">
                        <div class="image-input">
                            <input type="text" id="image1" required placeholder="URL da Imagem 1">
                        </div>
                        <div class="image-input">
                            <input type="text" id="image2" required placeholder="URL da Imagem 2">
                        </div>
                        <div class="image-input">
                            <input type="text" id="image3" required placeholder="URL da Imagem 3">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="price">Preço *</label>
                    <input type="text" id="price" required placeholder="Ex: R$ 149,90">
                </div>

                <div class="form-group">
                    <label for="link">Link de Compra *</label>
                    <input type="text" id="link" required placeholder="https://sua-loja.com/produto">
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="active" checked>
                        <label for="active" style="margin: 0;">Produto em Destaque (aparece na home)</label>
                    </div>
                    <p style="color: #999; font-size: 12px; margin-top: 5px;">
                        ⚠️ Apenas 1 produto pode estar ativo por vez
                    </p>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span id="btn-text">💾 Salvar Produto</span>
                </button>
                <button type="button" class="btn" onclick="cancelEdit()" id="cancelBtn" style="display: none; margin-left: 10px; background: #95a5a6; color: white;">
                    Cancelar
                </button>
            </form>
        </div>

        <div class="card">
            <h2 style="color: #667eea; margin-bottom: 20px;">Produtos Cadastrados</h2>
            <div id="produtosList" class="produtos-list">
                <div class="loading">Carregando produtos...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        // Carregar produtos ao iniciar
        loadProdutos();

        // Submit do formulário
        document.getElementById('produtoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const produtoId = document.getElementById('produtoId').value;
            const isEdit = produtoId !== '';

            const produto = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                images: [
                    document.getElementById('image1').value,
                    document.getElementById('image2').value,
                    document.getElementById('image3').value,
                ],
                price: document.getElementById('price').value,
                link: document.getElementById('link').value,
                active: document.getElementById('active').checked,
            };

            try {
                const url = isEdit 
                    ? `${API_URL}/api/shop/produtos/${produtoId}`
                    : `${API_URL}/api/shop/produtos`;

                const method = isEdit ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(produto),
                });

                if (response.ok) {
                    showAlert('Produto salvo com sucesso!', 'success');
                    document.getElementById('produtoForm').reset();
                    document.getElementById('produtoId').value = '';
                    document.getElementById('form-title').textContent = 'Adicionar Novo Produto';
                    document.getElementById('btn-text').textContent = '💾 Salvar Produto';
                    document.getElementById('cancelBtn').style.display = 'none';
                    loadProdutos();
                } else {
                    const error = await response.json();
                    showAlert('Erro ao salvar produto: ' + error.detail, 'error');
                }
            } catch (error) {
                showAlert('Erro de conexão: ' + error.message, 'error');
            }
        });

        async function loadProdutos() {
            try {
                const response = await fetch(`${API_URL}/api/shop/produtos`);
                const produtos = await response.json();

                const listDiv = document.getElementById('produtosList');

                if (produtos.length === 0) {
                    listDiv.innerHTML = '<p style="text-align: center; color: #999;">Nenhum produto cadastrado ainda.</p>';
                    return;
                }

                listDiv.innerHTML = produtos.map(produto => `
                    <div class="produto-item ${produto.active ? 'active' : ''}">
                        <div class="produto-info">
                            <h3>
                                ${produto.title}
                                ${produto.active ? '<span class="badge badge-success">ATIVO</span>' : ''}
                            </h3>
                            <p><strong>Preço:</strong> ${produto.price}</p>
                            <p><strong>Imagens:</strong> ${produto.images.length} foto(s)</p>
                            <p style="font-size: 12px; color: #999;">ID: ${produto.id}</p>
                        </div>
                        <div class="produto-actions">
                            <button class="btn btn-edit" onclick='editProduto(${JSON.stringify(produto)})'>
                                ✏️ Editar
                            </button>
                            <button class="btn btn-danger" onclick="deleteProduto('${produto.id}')">
                                🗑️ Deletar
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('produtosList').innerHTML = 
                    '<p style="text-align: center; color: #e74c3c;">Erro ao carregar produtos</p>';
            }
        }

        function editProduto(produto) {
            document.getElementById('produtoId').value = produto.id;
            document.getElementById('title').value = produto.title;
            document.getElementById('description').value = produto.description;
            document.getElementById('image1').value = produto.images[0] || '';
            document.getElementById('image2').value = produto.images[1] || '';
            document.getElementById('image3').value = produto.images[2] || '';
            document.getElementById('price').value = produto.price;
            document.getElementById('link').value = produto.link;
            document.getElementById('active').checked = produto.active;

            document.getElementById('form-title').textContent = 'Editar Produto';
            document.getElementById('btn-text').textContent = '💾 Atualizar Produto';
            document.getElementById('cancelBtn').style.display = 'inline-block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('produtoForm').reset();
            document.getElementById('produtoId').value = '';
            document.getElementById('form-title').textContent = 'Adicionar Novo Produto';
            document.getElementById('btn-text').textContent = '💾 Salvar Produto';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        async function deleteProduto(id) {
            if (!confirm('Tem certeza que deseja deletar este produto?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/shop/produtos/${id}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    showAlert('Produto deletado com sucesso!', 'success');
                    loadProdutos();
                } else {
                    showAlert('Erro ao deletar produto', 'error');
                }
            } catch (error) {
                showAlert('Erro de conexão: ' + error.message, 'error');
            }
        }

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.className = type === 'success' ? 'alert alert-success' : 'alert alert-error';
            alertDiv.textContent = message;
            alertDiv.classList.remove('hidden');

            setTimeout(() => {
                alertDiv.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
